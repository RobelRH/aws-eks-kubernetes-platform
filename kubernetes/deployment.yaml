apiVersion: apps/v1
kind: Deployment
metadata:
  name: eks-kubernetes-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eks-kubernetes-app
  template:
    metadata:
      labels:
        app: eks-kubernetes-app
    spec:
      containers:
        - name: app
          image: aws-eks-kubernetes-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080

          env:
            - name: APP_VERSION
              value: "v2.0.0"

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"